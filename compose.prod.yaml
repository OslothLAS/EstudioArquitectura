# Despliegue completo (app + PostgreSQL) en un servidor con Docker:
#   docker compose -f compose.prod.yaml up -d --build
# Los valores se leen del archivo .env (CLOUDINARY_URL, SYNC_TOKEN, DB_PASSWORD).
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/estudio
      DB_USER: estudio
      DB_PASSWORD: ${DB_PASSWORD:-estudio}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: estudio
      POSTGRES_USER: estudio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estudio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estudio -d estudio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
