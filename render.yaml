# Blueprint de Render: en el panel, "New > Blueprint" y elegí este repositorio.
# Crea la web (desde el Dockerfile) y la base PostgreSQL, y las conecta solas.
# CLOUDINARY_URL y SYNC_TOKEN se piden al crear el blueprint (no se guardan acá).
services:
  - type: web
    name: estudio-arquitectura
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /estudio_de_arquitectura.html
    envVars:
      - key: DB_HOST
        fromDatabase: { name: estudio-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: estudio-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: estudio-db, property: database }
      - key: DB_USER
        fromDatabase: { name: estudio-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: estudio-db, property: password }
      - key: CLOUDINARY_URL
        sync: false
      - key: SYNC_TOKEN
        sync: false

databases:
  - name: estudio-db
    plan: free
    databaseName: estudio
    user: estudio
