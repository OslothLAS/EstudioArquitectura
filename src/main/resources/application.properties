spring.application.name=EstudioArquitectura

# Valores locales y secretos (CLOUDINARY_URL, etc.) en un archivo .env junto al pom.xml.
# Ese archivo no se sube al repositorio (está en .gitignore).
spring.config.import=optional:file:.env[.properties]

# --- Base de datos (PostgreSQL) ---
# En desarrollo se levanta sola con compose.yaml (requiere Docker Desktop abierto).
# En producción, definí estas variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/estudio}
spring.datasource.username=${DB_USER:estudio}
spring.datasource.password=${DB_PASSWORD:estudio}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Cloudinary ---
# Copiá la "API environment variable" de tu panel de Cloudinary
# (formato cloudinary://API_KEY:API_SECRET@CLOUD_NAME) en CLOUDINARY_URL, ya sea como
# variable de entorno o dentro del archivo .env. Nunca la escribas directamente en este archivo.
# Si queda vacía, la app arranca igual pero no sincroniza imágenes.
app.cloudinary.url=${CLOUDINARY_URL:}

# Carpeta raíz en Cloudinary y secciones de la página (una subcarpeta por sección)
app.imagenes.carpeta-raiz=estudio
# En "proceso" cada imagen (o GIF) se nombra igual que su etapa: plan-de-necesidades, croquis, anteproyecto, ...
app.imagenes.secciones=portada,nosotros,proceso

# Cada cuánto se sincroniza con Cloudinary (milisegundos). 600000 = 10 minutos
app.imagenes.sincronizacion-ms=600000

# Token para forzar una sincronización manual con POST /api/imagenes/sincronizar
# (header X-Sync-Token). Si queda vacío, ese endpoint está deshabilitado.
app.imagenes.token-sincronizacion=${SYNC_TOKEN:}
